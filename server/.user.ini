; server/.user.ini
; Per-directory PHP settings for the form endpoints (read by PHP-FPM /
; CGI hosts such as cPanel/HostGator; ignored by `php -S` and mod_php).
; Lets careers-submit.php accept the 10 MB résumé the form allows — many
; hosts default upload_max_filesize to 2 MB. post_max_size leaves room
; for the other form fields and multipart overhead.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5
file_uploads = On
; Never show PHP warnings/paths to visitors (they'd also break the redirect headers).
display_errors = Off
display_startup_errors = Off
log_errors = On
